name: argentum
description: Argentum AI — Adaptive Exam Preparation for University Students
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # ── Google Sign-In ──────────────────────────────────────────
  google_sign_in: ^6.2.1

  # ── State Management ────────────────────────────────────────
  provider: ^6.1.2

  # ── HTTP / API ───────────────────────────────────────────────
  http: ^1.2.1
  dio: ^5.7.0

  # ── File Handling ────────────────────────────────────────────
  file_picker: ^8.1.2
  path: ^1.9.0
  mime: ^1.0.5

  # ── Payments ────────────────────────────────────────────────
  # flutter_paystack: re-add when building mobile release

  # ── UI / UX ─────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  fluttertoast: ^8.2.8
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.69.0

  # ── Local Storage ───────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── Utils ───────────────────────────────────────────────────
  uuid: ^4.5.1
  intl: ^0.19.0
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/