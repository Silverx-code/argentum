// android/app/build.gradle
//
// ── IMPORTANT CHANGES NEEDED ──────────────────────────────────────────
// 1. Change applicationId to your actual package name
// 2. minSdk must be 21+ for Firebase
// 3. google-services plugin must be applied at bottom
// ──────────────────────────────────────────────────────────────────────

plugins {
    id "com.android.application"
    id "kotlin-android"
    // FlutterFire plugin — MUST be at bottom
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.argentum.app"

    compileSdk flutter.compileSdkVersion

    defaultConfig {
        // ── Change this to your actual package name ──────────────────
        applicationId "com.argentum.app"

        minSdk 21             // Firebase requires 21+
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true  // Required for Firebase
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // Multidex for Firebase on older Android
    implementation "androidx.multidex:multidex:2.0.1"
}

flutter {
    source "../.."
}
